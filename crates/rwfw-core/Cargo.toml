[package]
name = "rwfw-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["postgres", "sqlite"]
# Database drivers. Both are on by default; an app that uses only one can set
# `default-features = false, features = ["postgres"]` and drop the other driver
# (and, for SQLite, the bundled libsqlite3-sys) from its build.
postgres = ["sea-orm/sqlx-postgres"]
sqlite = ["sea-orm/sqlx-sqlite"]

[dependencies]
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower-sessions = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
config = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
mime_guess = "2"
minijinja = { version = "2", features = ["loader", "json", "loop_controls"] }
minijinja-autoreload = "2"
notify = "8"
tokio-stream = { version = "0.1", features = ["sync"] }
validator = { version = "0.20", features = ["derive"] }
rwfw-shared = { path = "../rwfw-shared" }
hyper = "1"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
serde_urlencoded = "0.7"
