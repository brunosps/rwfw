database:
  url: "postgres://rwfw:rwfw@localhost:54329/rwfw_dev"

server:
  host: "0.0.0.0"
  port: 3000

logging:
  level: "debug"
  format: "pretty"

security:
  headers_enabled: true
  hsts: false
  frame_options: "SAMEORIGIN"
  referrer_policy: "strict-origin-when-cross-origin"
  # base.html.j2 loads every script from a file: no 'unsafe-inline' for scripts.
  content_security_policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
  rate_limit:
    enabled: false
    max_requests: 10
    window_secs: 60

auth:
  session_ttl: 86400
  oidc:
    redirect_base_url: "http://localhost:3000"
    providers: {}

blog:
  posts_per_page: 20
  allow_comments: true
